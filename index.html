<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#38240f">
  <meta name="description" content="Arma Flour Mill — coming soon.">
  <title>Arma Flour Mill | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fffaf0;
      --gold: #c3a16a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #38240f;
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    }
    .hero {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 30px 22px;
      text-align: center;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url("assets/wheat-background.jpeg") center 52% / cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg,
        rgba(20, 31, 34, .20) 0%,
        rgba(20, 31, 34, .42) 48%,
        rgba(20, 24, 23, .50) 100%);
    }
    .content {
      width: min(100%, 620px);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-in .8s ease-out both;
    }
    .logo {
      display: block;
      width: clamp(76px, 11vw, 112px);
      height: auto;
      object-fit: contain;
      margin: 0 auto 24px;
      mix-blend-mode: screen;
      opacity: .94;
      filter: drop-shadow(0 1px 7px rgba(0,0,0,.12));
    }
    h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(1.25rem, 3.3vw, 2rem);
      font-weight: 500;
      letter-spacing: .065em;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 1px 7px rgba(0,0,0,.15);
    }
    .rule {
      width: min(100%, 430px);
      height: 1px;
      margin: 17px 0 18px;
      background: rgba(255, 250, 240, .72);
    }
    .tagline {
      margin: 0;
      max-width: 390px;
      font-size: clamp(.76rem, 1.55vw, .9rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .105em;
      text-shadow: 0 1px 5px rgba(0,0,0,.18);
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (max-width: 480px) {
      .hero { padding: 24px 22px; }
      .hero::before { background-position: 45% center; }
      .logo { width: 78px; margin-bottom: 22px; }
      h1 { font-size: clamp(1.18rem, 5.2vw, 1.5rem); letter-spacing: .045em; }
      .rule { width: min(100%, 330px); margin: 15px 0 16px; }
      .tagline { font-size: .74rem; letter-spacing: .075em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="content" aria-labelledby="coming-soon">
      <img class="logo" src="assets/arma-logo.png" alt="Arma Flour Mill logo">
      <h1 id="coming-soon">We're Coming Soon</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">We're working hard to bring you<br>the best quality flour.</p>
    </section>
  </main>
</body>
</html>
